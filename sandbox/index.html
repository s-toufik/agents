<!DOCTYPE html>
<html>
<head>
    <title>Agent Chat</title>

    <style>

        body {
            margin: 0;
            background: #343541;
            font-family: Arial, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }


        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }


        .message {
            max-width: 800px;
            margin: 15px auto;
            padding: 15px 20px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
        }


        .user {
            background: #2b6cb0;
            text-align: right;
        }


        .assistant {
            background: #444654;
        }


        .status {
            max-width: 800px;
            margin: 5px auto;
            color: #aaa;
            font-size: 14px;
        }


        #input-area {
            display: flex;
            padding: 15px;
            background: #40414f;
        }


        #message {
            flex: 1;
            resize: none;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
        }


        button {
            margin-left: 10px;
            padding: 0 25px;
            border-radius: 8px;
            border: none;
            background: #10a37f;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }


        button:disabled {
            background: #555;
            cursor: not-allowed;
        }


    </style>

</head>


<body>


<div id="chat"></div>


<div id="input-area">

<textarea
        id="message"
        rows="1"
        placeholder="Message your agent..."
></textarea>


    <button id="send">
        Send
    </button>

</div>


<script>


    const chat =
        document.getElementById("chat");

    const input =
        document.getElementById("message");

    const button =
        document.getElementById("send");


    const sessionId =
        crypto.randomUUID();


    function addMessage(
        text,
        type
    ) {

        const div =
            document.createElement("div");


        div.className =
            "message " + type;


        div.textContent =
            text;


        chat.appendChild(div);

        scrollBottom();

        return div;
    }


    function addStatus(text) {

        const div =
            document.createElement("div");

        div.className = "status";

        div.id = "status";

        div.textContent = text;

        chat.appendChild(div);

        scrollBottom();

    }


    function removeStatus() {

        const status =
            document.getElementById("status");

        if (status)
            status.remove();

    }


    function scrollBottom() {

        chat.scrollTop =
            chat.scrollHeight;

    }


    function setRunning(running) {

        input.disabled =
            running;

        button.disabled =
            running;


        if (running) {

            button.textContent =
                "Thinking...";

        } else {

            button.textContent =
                "Send";

        }

    }


    async function sendMessage() {


        const message =
            input.value.trim();


        if (!message)
            return;


        input.value = "";


        setRunning(true);


        addMessage(
            message,
            "user"
        );


        const assistant =
            addMessage(
                "",
                "assistant"
            );


        addStatus(
            "Agent is thinking..."
        );


        const response =
            await fetch(
                "http://localhost:8000/chat/stream",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        session_id:
                        sessionId,

                        message:
                        message

                    })

                }
            );


        const reader =
            response.body.getReader();


        const decoder =
            new TextDecoder();


        let buffer = "";


        while (true) {


            const {
                value,
                done
            } =
                await reader.read();


            if (done)
                break;


            buffer +=
                decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );


            const events =
                buffer.split("\n\n");


            buffer =
                events.pop();


            for (const event of events) {


                if (!event.trim())
                    continue;


                const lines =
                    event.split("\n");


                let eventType =
                    "message";


                let data =
                    null;


                for (const line of lines) {


                    if (line.startsWith("event:")) {

                        eventType =
                            line.substring(6)
                                .trim();

                    }


                    if (line.startsWith("data:")) {

                        data =
                            JSON.parse(
                                line.substring(5)
                            );

                    }

                }


                if (!data)
                    continue;


                //
                // Planner streaming
                //
                if (eventType === "token") {

                    removeStatus();


                    assistant.textContent +=
                        data.token;


                    scrollBottom();

                }


                //
                // Final answer received
                //
                if (eventType === "final") {

                    removeStatus();


                    assistant.textContent =
                        data.answer;


                    scrollBottom();

                }


                //
                // Completely finished
                //
                if (eventType === "done") {

                    removeStatus();


                    addStatus(
                        "Ready for next message"
                    );


                    setRunning(false);

                }


            }

        }


        setRunning(false);

    }


    button.onclick =
        sendMessage;


    input.addEventListener(
        "keydown",
        function (e) {


            if (
                e.key === "Enter"
                &&
                !e.shiftKey
            ) {

                e.preventDefault();

                sendMessage();

            }

        }
    );


</script>


</body>
</html>
