[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.1.0"
authors = [
    { name = "Toufik Saouchi", email = "toufik.saouchi@gmail.com" },
]
description = "description"
readme = "Readme.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
dependencies = [
    "ipykernel>=7.3.0",
    "numpy",
    "matplotlib",
    "python-dotenv",
    "aiobreaker",
    "fastapi",
    "uvicorn[standard]",
    "uvloop",
    "loguru",
    "omegaconf",
    "pydantic>=2",
    "sqlglot",
    "langgraph-checkpoint-sqlite",
    "ruff",
    "scipy-stubs>=1.17.1.3",
    "Pyright",
    "mypy",
    "python-dotenv",
    "langchain",
    "langgraph",
    "langchain-core",
    "langchain-openai",
    "httpx",
    "httpx2",
    "mcp",
    "pycraftcore"
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis>=6.151.9",
    "pytest-asyncio",
    "Faker",
    "pytest-cov>=7.1.0",
    "ruff",
    "scipy-stubs>=1.17.1.3",
    "ty",
    "pre-commit"
]

[tool.uv.sources]
pycraftcore = { path = "../pycraftcore", editable = true }

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "UP",   # pyupgrade
]
ignore = [
    "B017", # Blind exeception in tests
    "BLE001", # Blind exception in code
    "E501", # Line length
]

[tool.ty.src]
include = ["src"]
exclude = ["tests", ".venv"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/s-toufik/agents"
