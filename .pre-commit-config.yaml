repos:
  - repo: local
    hooks:
      - id: ruff
        name: Run linter
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit, pre-push ]
      - id: pytest
        name: Run unit tests
        entry: uv run pytest --maxfail=1 --disable-warnings
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
