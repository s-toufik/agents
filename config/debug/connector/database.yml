connector:
  checkpointer:
    name: conversation_checkpointer
    type: database
    engine: sqlite
    host: ${oc.env:CHECKPOINT_DB_HOST}
    port: 0
    default_name: ${oc.env:CHECKPOINT_DB_NAME}
    pool: {}
    auth:
      type: none

  users:
    name: users_dashboard
    type: database
    engine: sqlite
    host: ${oc.env:USER_DB_HOST}
    port: 0
    default_name: ${oc.env:USER_DB_NAME}
    pool:
      max: 4
    auth:
      type: none
